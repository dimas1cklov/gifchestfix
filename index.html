<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
html,body{margin:0;height:100%;background:#fff;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden;font-family:'TikTok Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#161823;background:#fff}
#app button{font-family:inherit;color:inherit}
.hidden{display:none!important}
.tap{background:none;border:0;padding:0;margin:0;cursor:pointer}
img{-webkit-user-drag:none;user-select:none}
.glitch{text-shadow:-2px -1px 0 #25F4EE,2px 1px 0 #FE2C55}
.glitchSm{text-shadow:-1.5px -1px 0 rgba(37,244,238,.9),1.5px 1px 0 rgba(254,44,85,.9)}

/* ---------- falling gifts (pre-blurred sprites, GPU only) ---------- */
.rainBox{position:absolute;overflow:hidden;pointer-events:none}
.rain{position:absolute;top:-160px;will-change:transform;animation-timing-function:linear;animation-iteration-count:infinite}
.fallA{animation-name:fallA}.fallB{animation-name:fallB}
@keyframes fallA{0%{transform:translate3d(0,0,0) rotate(-20deg)}100%{transform:translate3d(0,calc(100vh + 320px),0) rotate(25deg)}}
@keyframes fallB{0%{transform:translate3d(0,0,0) rotate(18deg)}100%{transform:translate3d(0,calc(100vh + 320px),0) rotate(-22deg)}}

/* ---------- enter ---------- */
#enter{position:absolute;inset:0}
.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:1rem}
.card{width:min(28rem,92vw);padding:2.25rem 2.25rem 2rem;border-radius:1.5rem;background:rgba(255,255,255,.94);border:1px solid #E3E3E4;box-shadow:0 1.5rem 3.75rem rgba(22,24,35,.12);display:flex;flex-direction:column;align-items:center;gap:1rem}
.cardIn{animation:cardIn .6s cubic-bezier(.3,1.3,.5,1) both}
@keyframes cardIn{0%{opacity:0;transform:translateY(24px) scale(.96)}100%{opacity:1;transform:none}}
#enterChest{width:6rem;height:auto}
h1{margin:0;font-size:2.75rem;font-weight:700;letter-spacing:-.5px;text-align:center}
.sub{margin:0 0 .25rem;font-size:1.1rem;color:#75767C;text-align:center}
.field{width:100%;display:flex;flex-direction:column;gap:.5rem}
label{font-size:1rem;font-weight:600}
.inputWrap{position:relative;width:100%}
#nick{width:100%;height:3.6rem;padding:0 6.75rem 0 1.15rem;border-radius:.5rem;border:1.5px solid #F1F1F2;background:#F1F1F2;color:#161823;font-family:inherit;font-size:1.3rem;font-weight:600;-webkit-user-select:text;user-select:text}
#nick::placeholder{color:#8A8B91}
#nick:focus{outline:none;border-color:#FE2C55;background:#fff}
#paste{position:absolute;right:.5rem;top:.5rem;height:2.6rem;padding:0 .9rem;border:0;border-radius:.4rem;background:#fff;color:#FE2C55!important;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 1px 3px rgba(22,24,35,.08)}
#paste:active{transform:scale(.95)}
.btn{width:100%;height:3.6rem;border:0;border-radius:.5rem;background:#FE2C55;color:#fff!important;font-size:1.3rem;font-weight:700;cursor:pointer}
.btn:disabled{background:#E3E3E4;color:#8A8B91!important;cursor:default}
.btn:not(:disabled):active{transform:scale(.98)}

/* ---------- play ---------- */
#play{position:absolute;inset:0}
#stage{position:absolute;pointer-events:none}
#stage .fadeL,#stage .fadeR{position:absolute;top:0;bottom:0;width:30%;z-index:2}
#stage .fadeL{left:0;background:linear-gradient(90deg,#fff,rgba(255,255,255,0))}
#stage .fadeR{right:0;background:linear-gradient(270deg,#fff,rgba(255,255,255,0))}
#stageGlow{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(254,44,85,.16),rgba(37,244,238,.14) 55%,rgba(255,255,255,0));animation:glow 3.2s ease-in-out infinite;will-change:transform,opacity;pointer-events:none}
@keyframes glow{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}

#chestBox{position:absolute;display:flex;flex-direction:column;align-items:center;gap:1rem;z-index:3;transform:translateX(-50%)}
#chest{position:relative;transform-origin:50% 90%;touch-action:manipulation}
#chestImg{display:block;width:100%;height:auto;pointer-events:none;position:relative;z-index:1}
#chestShadow{position:absolute;left:10%;right:10%;bottom:-6%;height:14%;border-radius:50%;background:radial-gradient(closest-side,rgba(22,24,35,.22),rgba(22,24,35,0))}
#chestFlash{position:absolute;left:-30%;top:-30%;width:160%;height:160%;border-radius:50%;opacity:0;z-index:2;pointer-events:none;mix-blend-mode:screen}
#chestFlash.red{background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(254,44,85,.5) 55%,rgba(254,44,85,0))}
#chestFlash.cyan{background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(37,244,238,.55) 55%,rgba(37,244,238,0))}
#chestFlash.go{animation:cflash .45s ease-out}
@keyframes cflash{0%{opacity:1;transform:scale(.6)}100%{opacity:0;transform:scale(1.1)}}
.shake{animation:shake .42s cubic-bezier(.3,1.6,.5,1)}
@keyframes shake{0%{transform:scale(1)}25%{transform:scale(1.14,.86) rotate(-5deg)}55%{transform:scale(.94,1.1) rotate(4deg)}80%{transform:scale(1.03,.97) rotate(-1deg)}100%{transform:scale(1)}}
.nope{animation:nope .35s ease-in-out}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#hint{font-size:1.2rem;font-weight:600;color:#75767C;text-align:center;white-space:nowrap;animation:hint 1.8s ease-in-out infinite}
@keyframes hint{0%,100%{opacity:.65}50%{opacity:1}}

/* ---------- gifts: X, Y and scale on separate layers = arc flight, all on the GPU ---------- */
.gx,.gy{position:absolute;left:0;top:0;will-change:transform}
.gx{z-index:5;visibility:hidden;pointer-events:none;transition:transform .8s cubic-bezier(.15,1.1,.35,1)}
.gy{transition:transform .8s cubic-bezier(.35,-.75,.55,1)}
.gs{display:block;position:relative;width:100%;height:100%;pointer-events:auto;will-change:transform,opacity;transition:transform .8s cubic-bezier(.2,1.4,.4,1),opacity .35s ease-out;touch-action:manipulation}
.gx.collect{transition:transform .55s cubic-bezier(.55,0,.85,.35)}
.gx.collect .gy{transition:transform .55s cubic-bezier(.2,.65,.4,1)}
.gx.collect .gs{transition:transform .55s ease-in,opacity .55s ease-in;pointer-events:none}
.gx.noanim,.gx.noanim .gy,.gx.noanim .gs{transition:none}
.gs .halo{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:50%;animation:halo 2.6s ease-in-out infinite;will-change:transform,opacity}
@keyframes halo{0%,100%{opacity:.6;transform:scale(.88)}50%{opacity:1;transform:scale(1.04)}}
.gs .bob{position:absolute;left:0;top:0;width:100%;height:100%;display:block;animation:bob 2.6s ease-in-out infinite;will-change:transform}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
.gs img{width:100%;height:100%;display:block;pointer-events:none}

/* collect effect: 200px box, scaled from JS */
.fx{position:absolute;left:0;top:0;width:200px;height:200px;pointer-events:none;z-index:6;transform-origin:0 0}
.fx span{position:absolute;opacity:0;will-change:transform,opacity}
.fxRing{left:30px;top:30px;width:140px;height:140px;border-radius:50%;border:5px solid #FE2C55}
.fxRing2{left:40px;top:40px;width:120px;height:120px;border-radius:50%;border:4px solid #25F4EE}
.spark{left:93px;top:93px;width:14px;height:14px;border-radius:50%}
.spark:nth-child(odd){background:#FE2C55}.spark:nth-child(even){background:#25F4EE}
.plus{left:0;top:40px;width:200px;text-align:center;font-size:40px;font-weight:700;color:#161823;text-shadow:-2px -1px 0 #25F4EE,2px 1px 0 #FE2C55}
.fx.go .fxRing{animation:ring .55s ease-out}
.fx.go .fxRing2{animation:ring .7s .06s ease-out}
@keyframes ring{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(1.35)}}
.fx.go .plus{animation:plus .8s ease-out}
@keyframes plus{0%{opacity:0;transform:translateY(10px) scale(.6)}25%{opacity:1;transform:translateY(-6px) scale(1.1)}100%{opacity:0;transform:translateY(-50px) scale(1)}}
@keyframes sp0{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(78px,0px) scale(.2)}}
.fx.go .spark:nth-child(3){animation:sp0 .6s cubic-bezier(.2,.8,.4,1)}
@keyframes sp1{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(74px,54px) scale(.2)}}
.fx.go .spark:nth-child(4){animation:sp1 .6s cubic-bezier(.2,.8,.4,1)}
@keyframes sp2{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(24px,74px) scale(.2)}}
.fx.go .spark:nth-child(5){animation:sp2 .6s cubic-bezier(.2,.8,.4,1)}
@keyframes sp3{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(-28px,87px) scale(.2)}}
.fx.go .spark:nth-child(6){animation:sp3 .6s cubic-bezier(.2,.8,.4,1)}
@keyframes sp4{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(-63px,46px) scale(.2)}}
.fx.go .spark:nth-child(7){animation:sp4 .6s cubic-bezier(.2,.8,.4,1)}
@keyframes sp5{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(-92px,0px) scale(.2)}}
.fx.go .spark:nth-child(8){animation:sp5 .6s cubic-bezier(.2,.8,.4,1)}
@keyframes sp6{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(-63px,-46px) scale(.2)}}
.fx.go .spark:nth-child(9){animation:sp6 .6s cubic-bezier(.2,.8,.4,1)}
@keyframes sp7{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(-28px,-87px) scale(.2)}}
.fx.go .spark:nth-child(10){animation:sp7 .6s cubic-bezier(.2,.8,.4,1)}
@keyframes sp8{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(24px,-74px) scale(.2)}}
.fx.go .spark:nth-child(11){animation:sp8 .6s cubic-bezier(.2,.8,.4,1)}

/* ---------- top bar ---------- */
#bar{position:absolute;left:max(1.25rem,env(safe-area-inset-left));right:max(1.25rem,env(safe-area-inset-right));top:calc(1rem + env(safe-area-inset-top));height:6rem;padding:0 1rem 0 .9rem;border-radius:1.25rem;background:#fff;border:1px solid #E3E3E4;box-shadow:0 .4rem 1.5rem rgba(22,24,35,.07);display:flex;align-items:center;justify-content:space-between;gap:1rem;z-index:10}
#plate{min-width:0;flex:0 1 auto;text-align:left;display:flex;align-items:center;gap:.9rem;height:4.25rem;padding:0 .9rem 0 .4rem;border-radius:2.2rem;background:#F1F1F2}
#plate:active{transform:scale(.98)}
.plateIn{animation:plateIn .8s cubic-bezier(.3,1.25,.45,1) both}
@keyframes plateIn{0%{opacity:0;transform:translateY(40vh) scale(1.4)}100%{opacity:1;transform:none}}
#avatar{flex:none;width:3.5rem;height:3.5rem;border-radius:50%;background:#161823;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:700;box-shadow:-3px -1px 0 #25F4EE,3px 1px 0 #FE2C55}
.pinfo{min-width:0;display:flex;flex-direction:column;gap:1px}
#pname{font-size:1.5rem;font-weight:700;color:#161823;line-height:1.15;max-width:16rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ptotal{font-size:.9rem;font-weight:600;color:#75767C;white-space:nowrap}
.reIcon{flex:none;width:2.75rem;height:2.75rem;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.reIcon svg{width:1.25rem;height:1.25rem}
#shelf{flex:none;display:flex;align-items:center;gap:.6rem}
.shelfIn{animation:shelfIn .7s .3s cubic-bezier(.3,1.3,.5,1) both}
@keyframes shelfIn{0%{opacity:0;transform:translateY(-30px)}100%{opacity:1;transform:none}}
.slot{width:5.25rem;height:4.5rem;position:relative;border-radius:.9rem;background:#F1F1F2;display:flex;align-items:center;justify-content:center}
.slot .pi{width:4.1rem;height:4.1rem}
.slot img{width:100%;height:100%;display:block}
.slot.dim img{opacity:.3;filter:grayscale(1)}
.slot .pi.pop{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
.badge{position:absolute;right:-.4rem;bottom:-.5rem;min-width:1.75rem;height:1.6rem;padding:0 .5rem;border-radius:.8rem;background:#E3E3E4;color:#75767C;font-size:.95rem;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.slot.has .badge{background:#FE2C55;color:#fff}
@media (orientation:portrait){
  .slot{width:4.2rem;height:3.9rem}
  .slot .pi{width:3.4rem;height:3.4rem}
  #shelf{gap:.45rem}
  #pname{max-width:9rem;font-size:1.3rem}
  #plate{gap:.6rem}
}

/* ---------- overlays (no backdrop blur: it is very slow on tablets) ---------- */
.overlay{position:absolute;inset:0;z-index:20;background:rgba(255,255,255,.88);display:flex;align-items:center;justify-content:center;padding:1rem;animation:ovIn .35s ease-out both}
@keyframes ovIn{0%{opacity:0}100%{opacity:1}}
.ocard{width:min(27rem,92vw);padding:2.5rem 2.25rem 2.1rem;border-radius:1.5rem;background:#fff;border:1px solid #E3E3E4;box-shadow:0 1.5rem 3.75rem rgba(22,24,35,.14);display:flex;flex-direction:column;align-items:center;gap:1.25rem;animation:cardPop .5s cubic-bezier(.3,1.4,.5,1) both}
@keyframes cardPop{0%{opacity:0;transform:scale(.85) translateY(20px)}100%{opacity:1;transform:none}}
.loader{position:relative;width:5rem;height:2.5rem}
.loader span{position:absolute;left:1.8rem;top:.55rem;width:1.4rem;height:1.4rem;border-radius:50%;mix-blend-mode:multiply}
.dotR{background:#FE2C55;animation:dotR .9s ease-in-out infinite}
.dotC{background:#25F4EE;animation:dotC .9s ease-in-out infinite}
@keyframes dotR{0%,100%{transform:translateX(-.95rem) scale(1)}50%{transform:translateX(.95rem) scale(.8)}}
@keyframes dotC{0%,100%{transform:translateX(.95rem) scale(.8)}50%{transform:translateX(-.95rem) scale(1)}}
.otitle{font-size:1.65rem;font-weight:700;color:#161823;text-align:center}
.otext{font-size:1.05rem;font-weight:600;color:#75767C;text-align:center;margin-top:.4rem}
.track{width:100%;height:.5rem;border-radius:.25rem;background:#F1F1F2;overflow:hidden}
.bar{height:100%;width:100%;border-radius:.25rem;background:linear-gradient(90deg,#25F4EE,#FE2C55);transform-origin:0 50%;transform:scaleX(0);animation:bar 2.4s cubic-bezier(.4,0,.2,1) forwards}
@keyframes bar{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.check{position:relative;width:6.5rem;height:6.5rem}
.ringOut{position:absolute;inset:0;border-radius:50%;border:4px solid #1FC66E;animation:ringOut .9s .15s ease-out both}
@keyframes ringOut{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(1.7)}}
.checkPop{position:absolute;inset:0;border-radius:50%;background:#1FC66E;display:flex;align-items:center;justify-content:center;box-shadow:0 .75rem 1.75rem rgba(31,198,110,.35);animation:checkPop .55s cubic-bezier(.3,1.7,.5,1) both}
.checkPop svg{width:3.5rem;height:3.5rem}
@keyframes checkPop{0%{transform:scale(0)}100%{transform:scale(1)}}
.checkPath{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .45s .3s ease-out forwards}
@keyframes draw{100%{stroke-dashoffset:0}}
#sentGifts{display:flex;gap:.5rem}
#sentGifts div{width:3.75rem;height:3.75rem;border-radius:.75rem;background:#F1F1F2;display:flex;align-items:center;justify-content:center}
#sentGifts img{width:3.25rem;height:3.25rem;display:block}
</style>
</head>
<body>
<div id="app">

  <!-- ENTER SCREEN -->
  <div id="enter">
    <div class="rainBox" id="rainWide" style="left:0;top:0;right:0;bottom:0"></div>
    <div class="center">
      <div class="card cardIn" id="enterCard">
        <img id="enterChest" alt="">
        <h1 class="glitch">Gift Chest</h1>
        <p class="sub">Tap the chest, catch the gifts, fill your shelf.</p>
        <div class="field">
          <label for="nick">Your nickname</label>
          <div class="inputWrap">
            <input id="nick" type="text" maxlength="16" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Enter nickname">
            <button id="paste" type="button" aria-label="Paste random nickname">Paste</button>
          </div>
        </div>
        <button id="start" class="btn" type="button" disabled style="margin-top:.25rem">Start</button>
      </div>
    </div>
  </div>

  <!-- PLAY SCREEN -->
  <div id="play" class="hidden">
    <div id="stage" aria-hidden="true">
      <div class="rainBox" id="rainStage" style="left:0;top:0;right:0;bottom:0"></div>
      <div class="fadeL"></div><div class="fadeR"></div>
    </div>
    <div id="stageGlow" aria-hidden="true"></div>

    <div id="cfx" aria-hidden="true"></div>
    <div id="combo" aria-hidden="true">x2</div>

    <div id="chestBox">
      <button id="chest" class="tap" type="button" aria-label="Open the chest">
        <span id="chestShadow" aria-hidden="true"></span>
        <img id="chestImg" alt="">
        <span id="chestFlash" aria-hidden="true"></span>
      </button>
      <div id="hint">Tap the chest!</div>
    </div>

    <div id="gifts"></div>
    <div id="fxLayer"></div>

    <div id="bar">
      <button id="plate" class="tap" type="button" aria-label="Restart app">
        <div id="avatar">?</div>
        <div class="pinfo">
          <span id="pname" class="glitchSm"></span>
          <span id="ptotal">0 gifts collected</span>
        </div>
        <span class="reIcon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#161823" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </span>
      </button>
      <div id="shelf"></div>
    </div>

    <div id="sending" class="overlay hidden">
      <div class="ocard" role="status">
        <div class="loader" aria-hidden="true"><span class="dotR"></span><span class="dotC"></span></div>
        <div>
          <div class="otitle">Sending to account…</div>
          <div class="otext" id="sendingText"></div>
        </div>
        <div class="track"><div class="bar"></div></div>
      </div>
    </div>

    <div id="sent" class="overlay hidden">
      <div class="ocard" role="status">
        <div class="check">
          <span class="ringOut" aria-hidden="true"></span>
          <div class="checkPop">
            <svg viewBox="0 0 48 48" fill="none" role="img" aria-label="Sent"><path class="checkPath" d="M12 25 L21 34 L37 15" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>
        <div>
          <div class="otitle glitchSm" style="font-size:1.9rem">Sent to account</div>
          <div class="otext" id="sentText"></div>
        </div>
        <div id="sentGifts"></div>
        <button id="again" class="btn" type="button">Play again</button>
      </div>
    </div>
  </div>

</div>

  function onTap(node, fn) {
    // fire on touch-down for instant response; ignore the follow-up click
    var t = 0;
    node.addEventListener('pointerdown', function (e) { if (e.pointerType !== 'mouse' || e.button === 0) { t = Date.now(); fn(e); } });
    node.addEventListener('click', function (e) { if (Date.now() - t > 600) fn(e); });
  }

  // block pinch / double-tap zoom on iOS
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });

  // ---------- static images ----------
  $('enterChest').src = IMG.chest;
  $('chestImg').src = IMG.chest;

  // ---------- layout (real screen size, no shrinking) ----------
  var L = {};
  function layout() {
    var W = window.innerWidth, H = window.innerHeight;
    app.style.width = W + 'px'; app.style.height = H + 'px';
    var k = clamp(Math.min(W, H) / 800, 0.72, 1.6);
    document.documentElement.style.fontSize = (16 * k) + 'px';

    var barRect = $('bar').getBoundingClientRect();
    var barBottom = barRect.height ? barRect.bottom : 16 * k * 7;
    var top = barBottom + 8 * k, ph = H - top;
    var land = W >= H;

    var G = land ? clamp(Math.min(ph * 0.25, W * 0.16), 110, 300) : clamp(Math.min(W * 0.25, ph * 0.16), 110, 300);
    var C = Math.round(G * 0.8);
    var cx = W / 2, cy = top + ph * 0.5;

    var slots;
    if (land) {
      slots = [[0.13, 0.18], [0.23, 0.5], [0.13, 0.82], [0.87, 0.18], [0.77, 0.5], [0.87, 0.82]];
    } else {
      slots = [[0.2, 0.14], [0.5, 0.1], [0.8, 0.14], [0.2, 0.86], [0.5, 0.9], [0.8, 0.86]];
    }
    L = {
      W: W, H: H, G: G, C: C, cx: cx, cy: cy, land: land,
      slots: slots.map(function (s) { return { x: s[0] * W, y: top + s[1] * ph }; })
    };

    // stage column with the falling gifts
    var sw = land ? Math.min(W * 0.36, G * 3) : W * 0.6;
    var st = $('stage');
    st.style.left = (cx - sw / 2) + 'px'; st.style.width = sw + 'px';
    st.style.top = top + 'px'; st.style.height = ph + 'px';
    var gl = $('stageGlow'), gs = C * 3;
    gl.style.width = gl.style.height = gs + 'px';
    gl.style.left = (cx - gs / 2) + 'px'; gl.style.top = (cy - gs / 2) + 'px';

    // chest
    var cb = $('chestBox');
    $('chest').style.width = C + 'px';
    cb.style.left = cx + 'px';
    cb.style.top = (cy - C * 0.5) + 'px';

    // chest burst (designed around a 130px chest)
    var bs = C / 130;
    $('cfx').style.transform = 'translate(' + (cx - 220 * bs) + 'px,' + (cy - 220 * bs) + 'px) scale(' + bs + ')';
    var cm = $('combo');
    cm.style.left = cx + 'px'; cm.style.top = (cy - C * 1.25) + 'px';

    // gifts
    giftEls.forEach(function (g, i) {
      g.gx.style.width = g.gx.style.height = G + 'px';
      g.gy.style.width = g.gy.style.height = G + 'px';
      var it = S.slots[i];
      if (it && it.phase === 'land') {
        var p = L.slots[i];
        it.x = p.x + it.jx * G; it.y = p.y + it.jy * G;
        g.gx.classList.add('noanim'); placeGift(i, it.x, it.y, it.rot, 1, 1); void g.gx.offsetWidth; g.gx.classList.remove('noanim');
      }
    });
  }

  // ---------- falling blurred gifts ----------
  function makeRain(box, n, seed) {
    var x = seed;
    var rnd = function () { x = (x * 9301 + 49297) % 233280; return x / 233280; };
    for (var i = 0; i < n; i++) {
      var size = Math.round(60 + rnd() * 50);
      var dur = 7 + rnd() * 6;
      var img = el('img', 'rain ' + (i % 2 ? 'fallA' : 'fallB'), box);
      img.alt = '';
      img.src = GIFTS[i % N].blur;
      img.style.left = 'calc(' + ((i + 0.5) / n * 100).toFixed(1) + '% - ' + (size / 2) + 'px)';
      img.style.width = img.style.height = size + 'px';
      img.style.animationDuration = dur.toFixed(1) + 's';
      img.style.animationDelay = (-rnd() * dur).toFixed(1) + 's';
    }
  }
  makeRain($('rainWide'), 10, 31);
  makeRain($('rainStage'), 6, 7);

  // ---------- chest burst markup ----------
  var cfx = $('cfx');
  var rays = el('img', 'rays', cfx); rays.src = IMG.rays; rays.alt = '';
  var inner = el('div', 'in', cfx);
  el('span', 'w1', inner); el('span', 'w2', inner);
  var cf = el('div', 'cf', cfx);
  for (var i = 0; i < 22; i++) el('span', '', cf);
  var stars = el('div', 'st', cfx);
  var starColors = ['#FE2C55', '#25F4EE', '#FFC83D'];
  for (var j = 0; j < 7; j++) {
    var sp = el('span', '', stars);
    sp.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C13 7 17 11 24 12C17 13 13 17 12 24C11 17 7 13 0 12C7 11 11 7 12 0Z" fill="' + starColors[j % 3] + '"/></svg>';
  }

  // ---------- shelf ----------
  var shelf = $('shelf');
  var slotEls = GIFTS.map(function (g) {
    var s = el('div', 'slot dim', shelf);
    var pi = el('div', 'pi', s);
    var im = el('img', '', pi); im.src = g.src; im.alt = g.name;
    var b = el('span', 'badge', s); b.textContent = '0';
    return { root: s, pi: pi, badge: b };
  });
  var sentGifts = $('sentGifts');
  GIFTS.forEach(function (g) { var d = el('div', '', sentGifts); var im = el('img', '', d); im.src = g.src; im.alt = g.name; });

  // ---------- gift elements (one per landing spot) ----------
  var SPOTS = 6;
  var giftLayer = $('gifts');
  var giftEls = [];
  for (var k = 0; k < SPOTS; k++) {
    (function (k) {
      var gx = el('div', 'gx noanim', giftLayer);
      var gy = el('div', 'gy', gx);
      var gs = el('button', 'tap gs', gy); gs.type = 'button';
      var halo = el('span', 'halo', gs);
      var bob = el('span', 'bob', gs);
      var im = el('img', '', bob); im.alt = '';
      onTap(gs, function () { collect(k); });
      giftEls.push({ gx: gx, gy: gy, gs: gs, halo: halo, bob: bob, img: im });
    })(k);
  }

  // ---------- collect fx pool ----------
  var fxLayer = $('fxLayer');
  var fxEls = [];
  for (var f = 0; f < 5; f++) {
    var d = el('div', 'fx', fxLayer);
    d.innerHTML = '<span class="fxRing"></span><span class="fxRing2"></span>' + new Array(11).join('<span class="spark"></span>') + '<span class="plus">+1</span>';
    fxEls.push(d);
  }
  var fxNext = 0;

  // ---------- state ----------
  var S;
  function shuffled() {
    var b = []; for (var i = 0; i < N; i++) b.push(i);
    for (var i2 = b.length - 1; i2 > 0; i2--) { var j2 = Math.floor(Math.random() * (i2 + 1)); var t = b[i2]; b[i2] = b[j2]; b[j2] = t; }
    return b;
  }
  function freshState() {
    // each gift drops exactly once per game, in a random order
    return { name: '', slots: new Array(SPOTS).fill(null), counts: new Array(N).fill(0), order: shuffled(), dropped: 0, combo: 1, lastTap: 0, sending: false, glowRed: false };
  }
  S = freshState();

  function placeGift(i, x, y, rot, scale, opacity) {
    var g = giftEls[i], G = L.G;
    g.gx.style.transform = 'translate3d(' + (x - G / 2).toFixed(1) + 'px,0,0)';
    g.gy.style.transform = 'translate3d(0,' + (y - G / 2).toFixed(1) + 'px,0)';
    g.gs.style.transform = 'rotate(' + rot.toFixed(1) + 'deg) scale(' + scale + ')';
    g.gs.style.opacity = opacity;
  }

  function updateHint() {
    var onField = S.slots.some(function (s) { return s && s.phase === 'land'; });
    var left = N - S.dropped;
    $('hint').textContent = left > 0 ? (onField ? 'Tap the gifts to collect' : 'Tap the chest!') : (onField ? 'Collect your gifts!' : '');
  }

  function updateShelf() {
    var total = 0;
    S.counts.forEach(function (c, i) {
      total += c;
      slotEls[i].badge.textContent = c;
      slotEls[i].root.classList.toggle('dim', !c);
      slotEls[i].root.classList.toggle('has', !!c);
    });
    $('ptotal').textContent = total === 1 ? '1 gift collected' : total + ' gifts collected';
    return total;
  }

  // ---------- chest tap ----------
  function tapChest() {
    if (S.sending) return;
    if (S.dropped >= N) { restartAnim($('chestBox'), 'nope'); return; }

    var now = Date.now();
    S.combo = now - S.lastTap < 650 ? S.combo + 1 : 1;
    S.lastTap = now;

    restartAnim($('chest'), 'shake');
    restartAnim(cfx, 'burst');
    var fl = $('chestFlash');
    S.glowRed = !S.glowRed;
    fl.className = S.glowRed ? 'red' : 'cyan';
    restartAnim(fl, 'go');
    if (S.combo >= 2) { var c = $('combo'); c.textContent = 'x' + S.combo; restartAnim(c, 'pop'); }

    // free landing spot, alternating sides
    var free = [];
    for (var i = 0; i < SPOTS; i++) if (!S.slots[i]) free.push(i);
    var wantA = S.dropped % 2 === 0;
    var pool = free.filter(function (i) { return (i < 3) === wantA; });
    if (!pool.length) pool = free;
    var k = pick(pool);
    var g = S.order[S.dropped];
    S.dropped++;

    var p = L.slots[k];
    var item = { g: g, phase: 'land', jx: Math.random() * 0.12 - 0.06, jy: Math.random() * 0.08 - 0.04, rot: Math.random() * 20 - 10 };
    item.x = p.x + item.jx * L.G; item.y = p.y + item.jy * L.G;
    S.slots[k] = item;

    var ge = giftEls[k];
    ge.img.src = GIFTS[g].src;
    ge.gs.setAttribute('aria-label', 'Collect ' + GIFTS[g].name);
    var delay = -(Math.random() * 2.6).toFixed(2) + 's';
    ge.halo.style.animationDelay = ge.bob.style.animationDelay = delay;
    ge.halo.style.background = 'radial-gradient(closest-side,' + (Math.random() < 0.5 ? 'rgba(37,244,238,.32)' : 'rgba(254,44,85,.22)') + ',rgba(255,255,255,0))';

    ge.gx.className = 'gx noanim';
    ge.gx.style.visibility = 'visible';
    placeGift(k, L.cx, L.cy, 0, 0.15, 0);
    void ge.gx.offsetWidth;
    ge.gx.className = 'gx';
    placeGift(k, item.x, item.y, item.rot, 1, 1);
    updateHint();
  }

  // ---------- gift tap ----------
  function collect(k) {
    var it = S.slots[k];
    if (!it || it.phase !== 'land') return;
    it.phase = 'collect';

    var fx = fxEls[fxNext]; fxNext = (fxNext + 1) % fxEls.length;
    var fs = L.G / 160;
    fx.style.transform = 'translate(' + (it.x - 100 * fs).toFixed(1) + 'px,' + (it.y - 100 * fs).toFixed(1) + 'px) scale(' + fs + ')';
    restartAnim(fx, 'go');

    var r = slotEls[it.g].root.getBoundingClientRect();
    var ge = giftEls[k];
    ge.gx.className = 'gx collect';
    placeGift(k, r.left + r.width / 2, r.top + r.height / 2, 0, (r.height * 0.9) / L.G, 1);

    later(function () {
      ge.gx.className = 'gx noanim';
      ge.gx.style.visibility = 'hidden';
      S.slots[k] = null;
      S.counts[it.g]++;
      restartAnim(slotEls[it.g].pi, 'pop');
      updateShelf();
      updateHint();
      if (!S.sending && S.counts.every(function (c) { return c > 0; })) {
        S.sending = true;
        later(function () {
          var n = updateShelf();
          $('sendingText').textContent = (n === 1 ? '1 gift' : n + ' gifts') + ' for @' + S.name;
          showOverlay('sending');
        }, 650);
        later(function () {
          $('sentText').textContent = updateShelf() + ' gifts delivered to @' + S.name;
          $('sending').classList.add('hidden');
          showOverlay('sent');
        }, 650 + 2600);
      }
    }, 560);
  }

  function showOverlay(id) {
    var o = $(id);
    o.classList.remove('hidden');
    [o].concat([].slice.call(o.querySelectorAll('*'))).forEach(function (n) {
      var a = getComputedStyle(n).animationName;
      if (a && a !== 'none') { n.style.animation = 'none'; void n.offsetWidth; n.style.animation = ''; }
    });
  }

  // ---------- screens ----------
  var nick = $('nick');
  function syncStart() { $('start').disabled = !nick.value.trim(); }
  nick.addEventListener('input', syncStart);
  nick.addEventListener('keydown', function (e) { if (e.key === 'Enter') start(); });

  $('paste').addEventListener('click', function () {
    var a = ['lucky', 'golden', 'cosmic', 'neon', 'royal', 'wild', 'sunny', 'mighty', 'magic', 'crystal', 'turbo', 'happy'];
    var b = ['phoenix', 'lion', 'pegasus', 'zeus', 'star', 'tiger', 'dragon', 'comet', 'panda', 'falcon', 'wizard', 'rocket'];
    var sep = pick(['.', '_', '']);
    var num = Math.random() < 0.7 ? Math.floor(Math.random() * 99 + 1) : '';
    var core = pick(a) + sep + pick(b);
    if (Math.random() < 0.7) core = pick(['mira' + sep + pick(b), pick(a) + sep + 'mira', 'mira' + sep + pick(a), 'its' + sep + 'mira']);
    nick.value = (core + num).slice(0, 16);
    syncStart();
  });

  function start() {
    var n = nick.value.trim();
    if (!n) return;
    S.name = n;
    nick.blur();
    $('pname').textContent = n;
    $('avatar').textContent = n.charAt(0).toUpperCase();
    updateShelf();
    updateHint();
    $('enter').classList.add('hidden');
    $('play').classList.remove('hidden');
    layout();
    restartAnim($('plate'), 'plateIn');
    restartAnim(shelf, 'shelfIn');
  }

  function restartApp() {
    clearTimers();
    S = freshState();
    giftEls.forEach(function (g) { g.gx.className = 'gx noanim'; g.gx.style.visibility = 'hidden'; });
    $('sending').classList.add('hidden');
    $('sent').classList.add('hidden');
    updateShelf();
    nick.value = '';
    syncStart();
    $('play').classList.add('hidden');
    $('enter').classList.remove('hidden');
    restartAnim($('enterCard'), 'cardIn');
  }

  $('start').addEventListener('click', start);
  onTap($('chest'), tapChest);
  $('plate').addEventListener('click', restartApp);
  $('again').addEventListener('click', restartApp);

  var rt;
  function relayout() { clearTimeout(rt); rt = setTimeout(layout, 120); }
  window.addEventListener('resize', relayout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 250); });
  layout();
})();
</script>
</body>
</html>
